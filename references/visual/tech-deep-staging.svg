<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect x="0" y="0" width="960" height="600" fill="#171e24" stroke="#171e24"/><text x="35" y="50" font-family="sans-serif" font-size="28" fill="#dfdbcd">Encenação em três distâncias</text><rect x="50" y="150" width="230" height="310" fill="#2a343c" stroke="#d6b677"/><rect x="360" y="205" width="230" height="255" fill="#2a343c" stroke="#d6b677"/><rect x="680" y="260" width="230" height="200" fill="#2a343c" stroke="#d6b677"/><circle cx="155" cy="280" r="45" fill="#8c9c9e"/><circle cx="465" cy="285" r="33" fill="#8c9c9e"/><circle cx="785" cy="300" r="22" fill="#8c9c9e"/><text x="90" y="125" font-family="sans-serif" font-size="19" fill="#dfdbcd">Primeiro plano</text><text x="410" y="175" font-family="sans-serif" font-size="19" fill="#dfdbcd">Plano médio</text><text x="725" y="230" font-family="sans-serif" font-size="19" fill="#dfdbcd">Fundo</text><text x="35" y="540" font-family="sans-serif" font-size="16" fill="#dfdbcd">Planejar oclusões e a ordem de informação. As três camadas são uma opção de encenação.</text><text x="35" y="573" font-family="sans-serif" font-size="15" fill="#dfdbcd">Diagrama autoral · hipótese técnica · conferir na mídia da produção</text></svg>