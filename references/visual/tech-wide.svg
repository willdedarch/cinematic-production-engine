<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect x="0" y="0" width="960" height="600" fill="#171e24" stroke="#171e24"/><text x="35" y="50" font-family="sans-serif" font-size="28" fill="#dfdbcd">Campo horizontal e distância de câmera</text><circle cx="470" cy="430" r="14" fill="#8c9c9e"/><text x="415" y="475" font-family="sans-serif" font-size="19" fill="#dfdbcd">Câmera fixa</text><path d="M470 420L290 120" fill="none" stroke="#d6b677" stroke-width="3"/><path d="M470 420L650 120" fill="none" stroke="#d6b677" stroke-width="3"/><path d="M290 120L650 120" fill="none" stroke="#d6b677" stroke-width="3"/><rect x="450" y="275" width="40" height="55" fill="#2a343c" stroke="#d6b677"/><text x="540" y="300" font-family="sans-serif" font-size="19" fill="#dfdbcd">Pessoa no mesmo ponto</text><text x="70" y="110" font-family="sans-serif" font-size="19" fill="#dfdbcd">24 mm · mesmo sensor e posição</text><text x="70" y="500" font-family="sans-serif" font-size="15" fill="#dfdbcd">Recuar para igualar o tamanho altera a perspectiva; trocar só a focal altera o campo.</text><text x="35" y="540" font-family="sans-serif" font-size="16" fill="#dfdbcd">O enquadramento muda com a focal. Perspectiva depende da posição.</text><text x="35" y="573" font-family="sans-serif" font-size="15" fill="#dfdbcd">Diagrama autoral · hipótese técnica · conferir na mídia da produção</text></svg>