<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect x="0" y="0" width="960" height="600" fill="#171e24" stroke="#171e24"/><text x="35" y="50" font-family="sans-serif" font-size="28" fill="#dfdbcd">Compressão e descompressão horizontal</text><circle cx="160" cy="280" r="95" fill="#8c9c9e"/><text x="90" y="425" font-family="sans-serif" font-size="19" fill="#dfdbcd">Objeto circular</text><path d="M280 280L370 280" fill="none" stroke="#d6b677" stroke-width="3"/><ellipse cx="480" cy="280" rx="48" ry="95" fill="#b5a17c"/><text x="390" y="425" font-family="sans-serif" font-size="19" fill="#dfdbcd">Registro 2× idealizado</text><path d="M575 280L665 280" fill="none" stroke="#d6b677" stroke-width="3"/><circle cx="790" cy="280" r="95" fill="#8c9c9e"/><text x="720" y="425" font-family="sans-serif" font-size="19" fill="#dfdbcd">Desqueeze 2×</text><text x="35" y="540" font-family="sans-serif" font-size="16" fill="#dfdbcd">O esquema representa squeeze. Flare, bokeh e aberrações dependem da lente real.</text><text x="35" y="573" font-family="sans-serif" font-size="15" fill="#dfdbcd">Diagrama autoral · hipótese técnica · conferir na mídia da produção</text></svg>