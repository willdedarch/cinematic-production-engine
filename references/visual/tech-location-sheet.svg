<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect x="0" y="0" width="960" height="600" fill="#171e24" stroke="#171e24"/><text x="35" y="50" font-family="sans-serif" font-size="28" fill="#dfdbcd">Planta e âncoras de locação</text><rect x="100" y="140" width="420" height="300" fill="#2a343c" stroke="#d6b677"/><rect x="100" y="230" width="20" height="95" fill="#b8d2d5" stroke="#d6b677"/><rect x="260" y="140" width="90" height="15" fill="#d9af7b" stroke="#d6b677"/><rect x="450" y="260" width="70" height="140" fill="#726652" stroke="#d6b677"/><text x="150" y="200" font-family="sans-serif" font-size="19" fill="#dfdbcd">Sala 6 × 4 m</text><text x="140" y="470" font-family="sans-serif" font-size="19" fill="#dfdbcd">Planta</text><text x="590" y="210" font-family="sans-serif" font-size="19" fill="#dfdbcd">Janela oeste</text><text x="590" y="280" font-family="sans-serif" font-size="19" fill="#dfdbcd">Porta norte</text><text x="590" y="350" font-family="sans-serif" font-size="19" fill="#dfdbcd">Banco leste</text><text x="35" y="540" font-family="sans-serif" font-size="16" fill="#dfdbcd">Derivar contraângulos da mesma planta. Não mover acessos para ajustar um plano.</text><text x="35" y="573" font-family="sans-serif" font-size="15" fill="#dfdbcd">Diagrama autoral · hipótese técnica · conferir na mídia da produção</text></svg>