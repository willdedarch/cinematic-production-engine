<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect x="0" y="0" width="960" height="600" fill="#171e24" stroke="#171e24"/><text x="35" y="50" font-family="sans-serif" font-size="28" fill="#dfdbcd">Eixo, entradas e orientação</text><rect x="90" y="130" width="780" height="340" fill="#2a343c" stroke="#d6b677"/><circle cx="300" cy="280" r="35" fill="#8c9c9e"/><circle cx="650" cy="280" r="35" fill="#8c9c9e"/><path d="M300 280L650 280" fill="none" stroke="#bb6560" stroke-width="3"/><circle cx="470" cy="395" r="16" fill="#8c9c9e"/><circle cx="620" cy="395" r="16" fill="#8c9c9e"/><text x="410" y="445" font-family="sans-serif" font-size="19" fill="#dfdbcd">CAM A</text><text x="635" y="445" font-family="sans-serif" font-size="19" fill="#dfdbcd">CAM B</text><text x="130" y="500" font-family="sans-serif" font-size="17" fill="#dfdbcd">Duas posições no mesmo lado da relação conservam a orientação básica.</text><text x="35" y="540" font-family="sans-serif" font-size="16" fill="#dfdbcd">Uma quebra deliberada exige contexto perceptível e revisão do diretor.</text><text x="35" y="573" font-family="sans-serif" font-size="15" fill="#dfdbcd">Diagrama autoral · hipótese técnica · conferir na mídia da produção</text></svg>