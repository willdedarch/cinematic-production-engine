<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect x="0" y="0" width="960" height="600" fill="#171e24" stroke="#171e24"/><text x="35" y="50" font-family="sans-serif" font-size="28" fill="#dfdbcd">Foco e profundidade de campo</text><path d="M90 350L870 350" fill="none" stroke="#d6b677" stroke-width="3"/><rect x="290" y="140" width="330" height="230" fill="#3d4b43" stroke="#d6b677"/><path d="M455 110L455 400" fill="none" stroke="#e3bb75" stroke-width="5"/><text x="315" y="195" font-family="sans-serif" font-size="19" fill="#dfdbcd">Faixa de nitidez aceitável</text><text x="390" y="450" font-family="sans-serif" font-size="19" fill="#dfdbcd">Plano de foco</text><text x="100" y="490" font-family="sans-serif" font-size="17" fill="#dfdbcd">Círculo de confusão, abertura, focal e distância precisam de unidades.</text><text x="35" y="540" font-family="sans-serif" font-size="16" fill="#dfdbcd">A transição é gradual. Esta faixa não simula desenho real de bokeh.</text><text x="35" y="573" font-family="sans-serif" font-size="15" fill="#dfdbcd">Diagrama autoral · hipótese técnica · conferir na mídia da produção</text></svg>