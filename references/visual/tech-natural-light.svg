<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect x="0" y="0" width="960" height="600" fill="#171e24" stroke="#171e24"/><text x="35" y="50" font-family="sans-serif" font-size="28" fill="#dfdbcd">Fonte física e preenchimento</text><rect x="100" y="120" width="760" height="330" fill="#2a343c" stroke="#d6b677"/><rect x="100" y="200" width="25" height="130" fill="#b4c6c5" stroke="#d6b677"/><circle cx="380" cy="275" r="40" fill="#8c9c9e"/><path d="M125 210L380 245" fill="none" stroke="#d6b677" stroke-width="3"/><path d="M125 325L380 305" fill="none" stroke="#d6b677" stroke-width="3"/><circle cx="590" cy="330" r="12" fill="#e6b877"/><text x="155" y="170" font-family="sans-serif" font-size="19" fill="#dfdbcd">Janela oeste</text><text x="590" y="385" font-family="sans-serif" font-size="19" fill="#dfdbcd">Fonte prática</text><text x="270" y="490" font-family="sans-serif" font-size="17" fill="#dfdbcd">A posição da fonte pertence ao lugar. O lado na tela muda no reverso.</text><text x="35" y="540" font-family="sans-serif" font-size="16" fill="#dfdbcd">Comparar sombra, exposição e rosto no enquadramento efetivamente obtido.</text><text x="35" y="573" font-family="sans-serif" font-size="15" fill="#dfdbcd">Diagrama autoral · hipótese técnica · conferir na mídia da produção</text></svg>