<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect x="0" y="0" width="960" height="600" fill="#171e24" stroke="#171e24"/><text x="35" y="50" font-family="sans-serif" font-size="28" fill="#dfdbcd">Recorte por contraluz</text><rect x="100" y="125" width="760" height="330" fill="#2a343c" stroke="#d6b677"/><circle cx="430" cy="300" r="50" fill="#111518"/><circle cx="430" cy="155" r="28" fill="#f2d18d"/><path d="M430 185L390 250" fill="none" stroke="#d6b677" stroke-width="3"/><path d="M430 185L470 250" fill="none" stroke="#d6b677" stroke-width="3"/><text x="485" y="160" font-family="sans-serif" font-size="19" fill="#dfdbcd">Fonte atrás do corpo</text><text x="350" y="425" font-family="sans-serif" font-size="19" fill="#dfdbcd">Contorno</text><text x="115" y="490" font-family="sans-serif" font-size="17" fill="#dfdbcd">Separar figura e fundo preservando o que a ação precisa mostrar.</text><text x="35" y="540" font-family="sans-serif" font-size="16" fill="#dfdbcd">O contorno visível não comprova leitura de face ou motivo dramático.</text><text x="35" y="573" font-family="sans-serif" font-size="15" fill="#dfdbcd">Diagrama autoral · hipótese técnica · conferir na mídia da produção</text></svg>