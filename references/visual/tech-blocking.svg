<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect x="0" y="0" width="960" height="600" fill="#171e24" stroke="#171e24"/><text x="35" y="50" font-family="sans-serif" font-size="28" fill="#dfdbcd">Objetivos e deslocamentos no espaço</text><rect x="90" y="130" width="780" height="340" fill="#2a343c" stroke="#d6b677"/><circle cx="290" cy="260" r="32" fill="#8c9c9e"/><circle cx="590" cy="350" r="32" fill="#8c9c9e"/><path d="M290 260L590 350" fill="none" stroke="#d6b677" stroke-width="3"/><path d="M290 260L390 210" fill="none" stroke="#d6b677" stroke-width="3"/><path d="M590 350L650 250" fill="none" stroke="#d6b677" stroke-width="3"/><text x="155" y="200" font-family="sans-serif" font-size="19" fill="#dfdbcd">Objetivo A</text><text x="610" y="415" font-family="sans-serif" font-size="19" fill="#dfdbcd">Objetivo B</text><text x="150" y="500" font-family="sans-serif" font-size="17" fill="#dfdbcd">Posição, acesso e olhar mudam com a ação, mantendo o espaço.</text><text x="35" y="540" font-family="sans-serif" font-size="16" fill="#dfdbcd">A câmera registra a encenação escolhida. A linha representa a relação dramática.</text><text x="35" y="573" font-family="sans-serif" font-size="15" fill="#dfdbcd">Diagrama autoral · hipótese técnica · conferir na mídia da produção</text></svg>