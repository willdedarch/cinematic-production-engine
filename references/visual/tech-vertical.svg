<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect x="0" y="0" width="960" height="600" fill="#171e24" stroke="#171e24"/><text x="35" y="50" font-family="sans-serif" font-size="28" fill="#dfdbcd">Recorte e informação protegida</text><rect x="100" y="100" width="720" height="405" fill="#2a343c" stroke="#d6b677"/><rect x="350" y="100" width="228" height="405" fill="none" stroke="#efce8f"/><circle cx="470" cy="230" r="40" fill="#8c9c9e"/><rect x="415" y="290" width="110" height="80" fill="#2a343c" stroke="#d6b677"/><text x="365" y="475" font-family="sans-serif" font-size="19" fill="#dfdbcd">Recorte 9:16</text><text x="115" y="505" font-family="sans-serif" font-size="15" fill="#dfdbcd">Manter rosto, mão e relação necessária dentro do recorte.</text><text x="35" y="540" font-family="sans-serif" font-size="16" fill="#dfdbcd">Guias ajudam a conferir perda de informação. Não atribuem nota artística.</text><text x="35" y="573" font-family="sans-serif" font-size="15" fill="#dfdbcd">Diagrama autoral · hipótese técnica · conferir na mídia da produção</text></svg>