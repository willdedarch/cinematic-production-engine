<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect x="0" y="0" width="960" height="600" fill="#171e24" stroke="#171e24"/><text x="35" y="50" font-family="sans-serif" font-size="28" fill="#dfdbcd">Separação atmosférica por distância</text><g opacity="1"><rect x="90" y="150" width="160" height="300" fill="#2a343c" stroke="#d6b677"/><circle cx="170" cy="235" r="40" fill="#b9c0ba"/></g><text x="105" y="495" font-family="sans-serif" font-size="19" fill="#dfdbcd">Perto</text><g opacity="0.65"><rect x="390" y="150" width="160" height="300" fill="#2a343c" stroke="#d6b677"/><circle cx="470" cy="235" r="40" fill="#b9c0ba"/></g><text x="405" y="495" font-family="sans-serif" font-size="19" fill="#dfdbcd">Médio</text><g opacity="0.3"><rect x="690" y="150" width="160" height="300" fill="#2a343c" stroke="#d6b677"/><circle cx="770" cy="235" r="40" fill="#b9c0ba"/></g><text x="705" y="495" font-family="sans-serif" font-size="19" fill="#dfdbcd">Distante</text><text x="35" y="540" font-family="sans-serif" font-size="16" fill="#dfdbcd">Contraste e cor dependem do ar e da luz. A névoa deve ter origem e alcance.</text><text x="35" y="573" font-family="sans-serif" font-size="15" fill="#dfdbcd">Diagrama autoral · hipótese técnica · conferir na mídia da produção</text></svg>