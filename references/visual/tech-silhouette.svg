<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect x="0" y="0" width="960" height="600" fill="#171e24" stroke="#171e24"/><text x="35" y="50" font-family="sans-serif" font-size="28" fill="#dfdbcd">Silhueta e separação do gesto</text><rect x="90" y="160" width="780" height="280" fill="#d0c6ae" stroke="#d6b677"/><circle cx="335" cy="290" r="75" fill="#141c21"/><rect x="485" y="190" width="110" height="250" fill="#141c21" stroke="#d6b677"/><text x="90" y="485" font-family="sans-serif" font-size="17" fill="#dfdbcd">Distância entre bordas preserva a leitura do braço e do objeto.</text><text x="35" y="540" font-family="sans-serif" font-size="16" fill="#dfdbcd">Verificar sobreposição no recorte final, em especial no formato vertical.</text><text x="35" y="573" font-family="sans-serif" font-size="15" fill="#dfdbcd">Diagrama autoral · hipótese técnica · conferir na mídia da produção</text></svg>