<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect x="0" y="0" width="960" height="600" fill="#171e24" stroke="#171e24"/><text x="35" y="50" font-family="sans-serif" font-size="28" fill="#dfdbcd">Distribuição de luz e sombra</text><rect x="90" y="145" width="780" height="300" fill="#12181c" stroke="#d6b677"/><rect x="130" y="180" width="215" height="230" fill="#c4b28b" stroke="#d6b677"/><circle cx="370" cy="300" r="70" fill="#5c5145"/><rect x="370" y="230" width="190" height="140" fill="#192025" stroke="#d6b677"/><text x="605" y="230" font-family="sans-serif" font-size="19" fill="#dfdbcd">Área iluminada</text><text x="605" y="280" font-family="sans-serif" font-size="19" fill="#dfdbcd">Área em sombra</text><text x="130" y="490" font-family="sans-serif" font-size="17" fill="#dfdbcd">Comparar quais partes do gesto ficam legíveis na direção da fonte.</text><text x="35" y="540" font-family="sans-serif" font-size="16" fill="#dfdbcd">Contraste por si não define gênero, qualidade ou intenção.</text><text x="35" y="573" font-family="sans-serif" font-size="15" fill="#dfdbcd">Diagrama autoral · hipótese técnica · conferir na mídia da produção</text></svg>